name: Commit counter

on:
  schedule:
    - cron: "30 1 * * *" # daily, 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-counter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: count
        env:
          TREATO_STATS_TOKEN: ${{ secrets.TREATO_STATS_TOKEN }}
        run: echo "commits=$(node scripts/count-commits.mjs)" >> "$GITHUB_OUTPUT"

      - run: node scripts/update-commits.mjs "${{ steps.count.outputs.commits }}"

      - run: |
          git diff --quiet && exit 0
          git config user.name "commit-counter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Commit counter: ${{ steps.count.outputs.commits }}"
          git pull --rebase
          git push
